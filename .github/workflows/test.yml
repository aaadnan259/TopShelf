name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No npm install: the test harness uses only Node built-ins, and the
      # sole devDependency (sharp) is for icon rendering, not tests.
      - run: node tests/run.js
