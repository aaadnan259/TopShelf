<?xml version="1.0" encoding="UTF-8"?>
<!--
  TopShelf icon: three ascending bars sitting on a shelf line. The tallest
  bar is highlighted (Amazon gold) to read as "best, on the top shelf".
  Source of truth for all raster sizes; see scripts/render-icons.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="26" fill="#131921"/>
  <!-- ascending bars -->
  <rect x="30" y="66" width="18" height="26" rx="3" fill="#dfe3e6"/>
  <rect x="55" y="50" width="18" height="42" rx="3" fill="#9aa4ad"/>
  <rect x="80" y="32" width="18" height="60" rx="3" fill="#febd69"/>
  <!-- shelf line -->
  <rect x="24" y="96" width="80" height="7" rx="3.5" fill="#febd69"/>
</svg>
