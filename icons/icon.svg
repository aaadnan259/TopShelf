<?xml version="1.0" encoding="UTF-8"?>
<!--
  TopShelf icon: Trophy Crown Tag sitting on smiling golden shelf.
  Source of truth for all raster sizes; see scripts/render-icons.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Dark squircle #131921 -->
  <rect width="128" height="128" rx="28" fill="#131921"/>

  <!-- Three-point crown with #F59E0B outline and white fill -->
  <path d="M 34 82
           L 30 42
           L 49 60
           L 64 28
           L 79 60
           L 98 42
           L 94 82
           Z"
        fill="#FFFFFF"
        stroke="#F59E0B"
        stroke-width="7"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Golden/yellow shelf pill -->
  <rect x="22" y="90" width="84" height="15" rx="7.5" fill="#FCD34D"/>

  <!-- Playful smile arc inside shelf pill -->
  <path d="M 54 96.5 C 57 100.5, 71 100.5, 74 96.5"
        fill="none"
        stroke="#131921"
        stroke-width="3.5"
        stroke-linecap="round"/>
</svg>
